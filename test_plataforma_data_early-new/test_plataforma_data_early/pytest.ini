[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --alluredir=allure-results
markers =
    integration: testes que dependem de componentes externos reais
    postgres: testes de integração PostgreSQL
    opensearch: testes de integração OpenSearch
    opensearch_product: testes que consultam o OpenSearch de produto compartilhado
    dashboards: testes de integração OpenSearch Dashboards
    client_data: testes integrados de dados de clientes
    wazuh: testes de comunicação e autenticação da API Wazuh
